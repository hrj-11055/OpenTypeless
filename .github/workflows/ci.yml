name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    # Legal hard gate: reverse-engineering research material must never be committed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Block intel/ from being committed
        run: if git ls-files intel/ | grep -q .; then echo "::error::intel/ must not be committed"; exit 1; fi

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npx electron-builder --mac dmg
      - uses: actions/upload-artifact@v4
        with:
          name: OpenTypeless-mac-arm64
          path: dist/*.dmg
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg

  ubuntu:
    # Fast lane: catches path-separator / case-sensitivity assumptions early.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
